    <circle cx="160" cy="180" r="38" stroke-width="1.2" stroke-dasharray="3 3"/>
    <!-- Moon craters -->
    <circle cx="148" cy="170" r="8" stroke-width="1.2"/>
    <circle cx="172" cy="188" r="11" stroke-width="1.2"/>
