    <path d="M160 120 L160 134 M160 226 L160 240 M100 180 L114 180 M206 180 L220 180" stroke-width="2"/>
    <path d="M118 138 L128 148 M192 212 L202 222 M118 222 L128 212 M192 148 L202 138" stroke-width="1.5"/>
    <path d="M138 126 L142 138 M182 222 L186 234 M106 198 L118 202 M202 158 L214 162" stroke-width="1"/>
    <path d="M182 126 L178 138 M138 222 L134 234 M106 162 L118 158 M202 202 L214 198" stroke-width="1"/>

