  <path d="M12 70 Q 20 67 28 70 T 48 70" stroke="#ffffff" stroke-width="2" fill="none" />
  <path d="M10 75 Q 22 72 34 75 T 50 75" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.7" />
