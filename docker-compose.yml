# BitHarbor — single-service stack. No env files, no sidecars:
# the app only calls public feeds (Nyaa, YTS, Apibay, YIFY Subtitles).
#
# NOTE: authored without a local Docker daemon — validate with
# `docker compose config` and `docker compose up --build` on a host with Docker.

services:
  web:
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
